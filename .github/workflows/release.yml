name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published, edited]

permissions:
  contents: write

env:
  FIREBIRD_SYSDBA_PASSWORD: masterkey

jobs:
  build-linux:
    name: Build & Package (Linux x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # The release notes are built from the log between this tag and the
          # previous one, and the default shallow clone has neither.
          fetch-depth: 0

      # Same real Firebird server + client dev headers as the regular build
      # workflow, so the release binary is built and smoke-tested against
      # the real fbclient before it's packaged - same spirit as FlameRobin's
      # own release.yml.
      - name: Install Firebird server
        run: |
          echo "firebird3.0-server shared/firebird/sysdba_password/first_install password ${FIREBIRD_SYSDBA_PASSWORD}" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y firebird3.0-server firebird3.0-utils firebird-dev

      - name: Setup Lazarus / FPC
        uses: gcarreno/setup-lazarus@v3.4.1
        with:
          lazarus-version: stable

      - name: Register IBX packages with lazbuild
        run: |
          lazbuild --add-package-link lib/fbintf/fbintf.lpk
          lazbuild --add-package-link lib/ibx4lazarus/ibexpress.lpk

      - name: Build Release
        run: lazbuild --build-mode=Release src/Source/marathon.lpi

      - name: Build and run IBX smoke test
        run: |
          lazbuild test/ibx_smoke_test.lpi
          ./test/ibx_smoke_test "localhost:/tmp/ibx_smoke_test.fdb" SYSDBA "${FIREBIRD_SYSDBA_PASSWORD}"

      - name: Determine release version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ github.event.release.tag_name }}"
          fi
          echo "MARATHON_VERSION=${VERSION:-dev}" >> "$GITHUB_ENV"

      - name: Package release archive
        run: |
          STAGE="marathon-${MARATHON_VERSION}-linux-x86_64"
          mkdir -p "$STAGE"
          cp src/Source/marathon "$STAGE/"
          cp README.md ROADMAP.md "$STAGE/"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          echo "MARATHON_ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"

      # The Linux job writes the notes; the other two only attach their assets.
      # Three jobs each generating notes is why past releases said nothing but
      # "Full Changelog" - whichever finished last overwrote the others, and
      # GitHub's generated body is a commit list rather than a description of
      # what changed.
      - name: Describe the release
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "### What changed"
            echo
            if [ -n "$PREV" ]; then
              # Subjects only, and only of commits that are not merges: the
              # bodies in this repository are long by design and belong in the
              # log rather than in a release note.
              git log --no-merges --pretty='- %s' "${PREV}..${GITHUB_REF_NAME}"
            else
              git log --no-merges --pretty='- %s' -20 "${GITHUB_REF_NAME}"
            fi
            echo
            echo "### Downloads"
            echo
            echo "- Linux x86_64: \`marathon-${GITHUB_REF_NAME}-linux-x86_64.tar.gz\`"
            echo "- Windows x86_64: \`marathon-${GITHUB_REF_NAME}-windows-x86_64.zip\`"
            echo "- macOS arm64: \`marathon-${GITHUB_REF_NAME}-macos-arm64.zip\`"
            echo
            if [ -n "$PREV" ]; then
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_REF_NAME}"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.MARATHON_ASSET }}
          body_path: release-notes.md

  build-windows:
    name: Build & Package (Windows x86_64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Installed directly from the Lazarus IDE's own file server rather
      # than the gcarreno/setup-lazarus action (unmaintained per its own
      # README, and it failed outright on the macOS job in this workflow's
      # first test run) - and rather than SourceForge, which serves a
      # Cloudflare "Just a moment..." JS challenge to non-browser clients
      # (Invoke-WebRequest/curl) from GitHub-hosted runner IPs specifically;
      # confirmed both sourceforge.net/.../download and the underlying
      # downloads.sourceforge.net host both hit it. download.lazarus-ide.org
      # mirrors the identical SourceForge directory tree on Lazarus's own
      # Apache server with no such protection.
      - name: Download Lazarus/FPC installer
        shell: pwsh
        run: |
          $url = "https://download.lazarus-ide.org/Lazarus%20Windows%2064%20bits/Lazarus%204.8/lazarus-4.8-fpc-3.2.2-win64.exe"
          Invoke-WebRequest -Uri $url -OutFile "lazarus-setup.exe" -UserAgent "Mozilla/5.0"

      - name: Install Lazarus/FPC (silent)
        shell: pwsh
        run: |
          $installDir = "C:\lazarus"
          # The Lazarus Windows installer is built with Inno Setup - these
          # are its standard unattended-install switches.
          Start-Process -FilePath ".\lazarus-setup.exe" `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/DIR=$installDir" `
            -Wait -NoNewWindow

          Add-Content -Path $env:GITHUB_PATH -Value $installDir

          $fpcExe = Get-ChildItem -Path "$installDir\fpc" -Filter "fpc.exe" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*bin*" } | Select-Object -First 1
          if ($fpcExe) {
            Add-Content -Path $env:GITHUB_PATH -Value $fpcExe.DirectoryName
          } else {
            Write-Error "fpc.exe not found under $installDir\fpc after install"
            exit 1
          }

      - name: Register IBX packages with lazbuild
        run: |
          lazbuild --add-package-link lib/fbintf/fbintf.lpk
          lazbuild --add-package-link lib/ibx4lazarus/ibexpress.lpk

      # marathon.lpi hardcodes TargetOS=linux (this port's only build target
      # to date), so a native Windows build needs --os/--cpu passed on the
      # command line to override it - otherwise lazbuild tries to
      # cross-compile for Linux from a Windows host, which the runner has no
      # toolchain for.
      - name: Build Release
        run: lazbuild --os=win64 --cpu=x86_64 --build-mode=Release src/Source/marathon.lpi

      - name: Determine release version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = "${{ github.event.release.tag_name }}"
          }
          if ([string]::IsNullOrEmpty($version)) { $version = "dev" }
          Add-Content -Path $env:GITHUB_ENV -Value "MARATHON_VERSION=$version"

      - name: Package release archive
        shell: pwsh
        run: |
          $stage = "marathon-$env:MARATHON_VERSION-windows-x86_64"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path "src\Source\marathon.exe" -Destination "$stage\"
          Copy-Item -Path "README.md","ROADMAP.md" -Destination "$stage\"
          Compress-Archive -Path $stage -DestinationPath "$stage.zip" -Force
          Add-Content -Path $env:GITHUB_ENV -Value "MARATHON_ASSET=$stage.zip"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.MARATHON_ASSET }}

  build-macos:
    name: Build & Package (macOS arm64)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Same rationale as the Windows job, plus: download.lazarus-ide.org
      # (Lazarus's own Apache file server, not SourceForge) mirrors the
      # identical files with no Cloudflare bot-challenge in the way.
      # Using the native "macOS aarch64" folder now too, since GitHub's
      # macos-latest runners are Apple Silicon - lazarus-darwin-aarch64
      # is a native build rather than x86_64-under-Rosetta. Lazarus 4.8's
      # macOS folders only ship an FPC 3.2.4rc1a build (not the 3.2.2
      # Linux/Windows use) - that's simply what's published there; the
      # dmg itself is a universal (Intel+ARM) build either way.
      - name: Download and install FPC
        run: |
          curl -sL -A "Mozilla/5.0" \
            "https://download.lazarus-ide.org/Lazarus%20macOS%20aarch64/Lazarus%204.8/fpc-3.2.4rc1a.intelarm64-macosx.dmg" \
            -o fpc.dmg
          hdiutil attach fpc.dmg -nobrowse -mountpoint /Volumes/fpc-installer
          FPC_PKG=$(find /Volumes/fpc-installer -maxdepth 2 -name "*.pkg" | head -1)
          if [ -z "$FPC_PKG" ]; then
            echo "No .pkg found in FPC dmg" >&2
            find /Volumes/fpc-installer
            exit 1
          fi
          sudo installer -pkg "$FPC_PKG" -target /
          hdiutil detach /Volumes/fpc-installer

      # Extracted under $HOME rather than /Applications so no sudo is needed
      # (this archive is ~365MB of many small files; per-file sudo made it
      # markedly slower).
      - name: Download and install Lazarus IDE
        run: |
          curl -sL -A "Mozilla/5.0" \
            "https://download.lazarus-ide.org/Lazarus%20macOS%20aarch64/Lazarus%204.8/lazarus-darwin-aarch64-4.8.zip" \
            -o lazarus.zip
          mkdir -p "$HOME/lazarus-ide"
          unzip -q lazarus.zip -d "$HOME/lazarus-ide"

          LAZBUILD=$(find "$HOME/lazarus-ide" -maxdepth 3 -name "lazbuild" -type f | head -1)
          if [ -z "$LAZBUILD" ]; then
            echo "lazbuild not found after unzip" >&2
            find "$HOME/lazarus-ide" -maxdepth 3
            exit 1
          fi
          LAZDIR=$(dirname "$LAZBUILD")
          echo "$LAZDIR" >> "$GITHUB_PATH"
          # The macOS build ships a config pointing at the historical
          # /Developer/lazarus/ install path, so lazbuild aborts with
          # "Invalid Lazarus directory" unless --lazarusdir overrides it.
          echo "LAZARUS_DIR=$LAZDIR" >> "$GITHUB_ENV"

      - name: Register IBX packages with lazbuild
        run: |
          lazbuild --lazarusdir="$LAZARUS_DIR" --add-package-link lib/fbintf/fbintf.lpk
          lazbuild --lazarusdir="$LAZARUS_DIR" --add-package-link lib/ibx4lazarus/ibexpress.lpk

      # Same TargetOS override as Windows, plus --ws=cocoa: GitHub's macOS
      # runners only support the Cocoa widgetset (see setup-lazarus's own
      # README), and the .lpi doesn't pin a widgetset itself.
      #
      # -ld_classic works around a toolchain incompatibility, not anything in
      # this codebase: Apple's new linker (Xcode 15+) rejects the *prebuilt*
      # LCL Cocoa objects shipped in the Lazarus 4.8 binary distribution with
      # "malformed method list atom 'ltmp5' ... fixups found beyond the number
      # of method entries" - FPC 3.2.x emits Objective-C method-list metadata
      # the new linker will not accept. Every unit compiles fine; only the
      # final link fails. Selecting the classic linker avoids it.
      - name: Build Release
        run: |
          lazbuild --lazarusdir="$LAZARUS_DIR" --os=darwin --cpu=aarch64 --ws=cocoa \
            --opt="-k-ld_classic" \
            --build-mode=Release src/Source/marathon.lpi

      - name: Determine release version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ github.event.release.tag_name }}"
          fi
          echo "MARATHON_VERSION=${VERSION:-dev}" >> "$GITHUB_ENV"

      - name: Package release archive
        run: |
          STAGE="marathon-${MARATHON_VERSION}-macos-arm64"
          mkdir -p "$STAGE"
          cp src/Source/marathon "$STAGE/"
          cp README.md ROADMAP.md "$STAGE/"
          zip -r "${STAGE}.zip" "$STAGE"
          echo "MARATHON_ASSET=${STAGE}.zip" >> "$GITHUB_ENV"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.MARATHON_ASSET }}
